<svg xmlns="http://www.w3.org/2000/svg" viewBox="123 116 1010 1010" width="1010" height="1010" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38C3FA"/>
      <stop offset="0.55" stop-color="#1A73E8"/>
      <stop offset="1" stop-color="#0B47B8"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7FAFE"/>
      <stop offset="1" stop-color="#E6EFFA"/>
    </linearGradient>
    <linearGradient id="flap" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2FA8FA"/>
      <stop offset="1" stop-color="#0C5FE0"/>
    </linearGradient>
    <linearGradient id="top" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#34D2FB"/>
      <stop offset="0.6" stop-color="#5CEBFF"/>
      <stop offset="1" stop-color="#3FC6F8"/>
    </linearGradient>
    <linearGradient id="left" x1="0.1" y1="0" x2="0.75" y2="0.95">
      <stop offset="0" stop-color="#2386F0"/>
      <stop offset="0.7" stop-color="#2BC8FC"/>
      <stop offset="1" stop-color="#3AE3FF"/>
    </linearGradient>
    <linearGradient id="band" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#27C4FF"/>
      <stop offset="0.5" stop-color="#1596F7"/>
      <stop offset="1" stop-color="#0A62DE"/>
    </linearGradient>
    <linearGradient id="dark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F6DE0"/>
      <stop offset="1" stop-color="#0A3FA6"/>
    </linearGradient>
    <linearGradient id="roll" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5CEBFF"/>
      <stop offset="0.25" stop-color="#3BBEF9"/>
      <stop offset="1" stop-color="#0A63E6"/>
    </linearGradient>
    <linearGradient id="inner" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A3FA0"/>
      <stop offset="1" stop-color="#062C7A"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#0B47B8" flood-opacity="0.22"/>
    </filter>
  </defs>

  <!-- page -->
  <g filter="url(#shadow)">
    <path d="M 276,158 H 793 Q 803,158 810,165 L 1003,356 Q 1010,363 1010,373 V 1064 Q 1010,1094 980,1094 H 276 Q 246,1094 246,1064 V 188 Q 246,158 276,158 Z"
          fill="url(#paper)" stroke="url(#frame)" stroke-width="30" stroke-linejoin="round"/>
    <path d="M 800,168 L 1000,366 H 850 Q 800,366 800,316 Z" fill="url(#flap)"/>
  </g>

  <!-- S ribbon -->
  <g filter="url(#shadow)">
    <!-- upper right end -->
    <path d="M 752,326 L 858,440 Q 882,468 858,492 Q 849,500 832,500 H 620 V 458 Z" fill="url(#dark)"/>
    <!-- top face -->
    <path d="M 470,310 H 738 Q 752,310 760,322 L 678,405 H 365 Z" fill="url(#top)"/>
    <!-- left block -->
    <path d="M 365,405 H 678 L 460,612 L 378,560 Q 363,550 363,530 V 420 Q 363,405 378,405 Z" fill="url(#left)"/>
    <!-- underside -->
    <path d="M 366,548 L 460,612 L 632,746 H 556 L 380,582 Q 366,568 366,548 Z" fill="url(#dark)"/>
    <!-- main band -->
    <path d="M 460,612 L 620,458 V 500 L 868,703 Q 880,714 880,732 V 848 Q 880,866 866,880 L 780,962 L 668,848 Q 652,826 666,802 L 740,746 H 632 Z" fill="url(#band)"/>
    <!-- bottom roll -->
    <path d="M 440,745 H 736 Q 770,745 772,785 V 820 H 668 Q 654,834 668,850 L 780,962 H 445 Q 405,962 382,928 Q 360,894 360,852 Q 360,806 390,776 Q 412,745 440,745 Z" fill="url(#roll)"/>
    <!-- inside of the roll -->
    <path d="M 660,822 H 772 V 790 Q 772,745 732,745 Q 702,752 676,778 Q 652,800 660,822 Z" fill="url(#inner)"/>
  </g>
</svg>
